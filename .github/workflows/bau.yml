# Baut Auriliux OS in der Cloud: bei jeder Änderung das Systemabbild, wöchentlich mit allen
# Sicherheitsupdates, und auf Knopfdruck den USB-/Festplatten-Installer (ISO).
name: Auriliux OS bauen

on:
  push:
    branches: [main]
    paths: ['image/**', 'shell/**', 'dienste/**', 'werkzeuge/**', '.github/workflows/bau.yml']
  schedule:
    - cron: '0 4 * * 1'          # jeden Montag 04:00 UTC: neue Sicherheitsupdates einbauen
  workflow_dispatch:
    inputs:
      installer:
        description: 'Installer (ISO) erzeugen'
        type: boolean
        default: false

permissions:
  contents: write                # Installer als Release-Datei ablegen
  packages: write                # Systemabbild in der GitHub-Registry speichern

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/auriliux-os

jobs:
  dienste:
    name: Dienste prüfen (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Übersetzen und testen
        working-directory: dienste
        run: |
          cargo --version
          cargo test --release --offline
          cargo build --release --offline
          ls -la target/release/auriliux-guardian target/release/auriliux-herzschlag target/release/auriliux-tresor

      - name: Tresor an echter btrfs-Platte prüfen
        run: |
          sudo apt-get install -y -qq btrfs-progs > /dev/null
          sudo bash werkzeuge/tresor-test.sh "$PWD/dienste/target/release/auriliux-tresor"

  abbild:
    name: Systemabbild
    needs: dienste
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Laser-Intro aufnehmen (Boot-Intro)
        continue-on-error: true
        run: |
          (cd werkzeuge/intro && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 1
          if node -e "process.exit(typeof WebSocket === 'function' ? 0 : 1)"; then N="node"; else N="node --experimental-websocket"; fi
          for versuch in 1 2 3; do
            rm -rf /tmp/intro-chrome image/intro-roh/roh-* image/intro-roh/aufnahme.json
            timeout 420 $N werkzeuge/intro-aufnehmen.mjs http://127.0.0.1:8765/index.html image/intro-roh && break
            echo "Aufnahme-Versuch $versuch fehlgeschlagen"; pkill -f intro-chrome || true; sleep 3
          done
          du -sh image/intro-roh

      - name: Abbild bauen
        run: |
          TAG=$(date -u +%Y%m%d)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sudo podman build --pull=newer -f image/Containerfile -t "$IMAGE:latest" -t "$IMAGE:$TAG" .

      - name: Vorschau-Bilder der Oberfläche
        continue-on-error: true
        run: |
          mkdir -p vorschau
          sudo podman run --rm -v "$PWD/werkzeuge:/werkzeuge:ro" -v "$PWD/vorschau:/aus" "$IMAGE:latest" bash /werkzeuge/vorschau.sh

      - name: Vorschau hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: vorschau/
          retention-days: 14

      - name: In die Registry hochladen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:latest"
          sudo podman push "$IMAGE:$TAG"

  installer:
    name: Installer (ISO)
    needs: abbild
    if: github.event_name == 'workflow_dispatch' && inputs.installer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Installer erzeugen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE:latest"
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs "$IMAGE:latest"
          sudo find output -name '*.iso' -exec ls -la {} \;

      - name: Als Release ablegen (in 1,9-GB-Teilen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(sudo find output -name '*.iso' | head -1)
          TAG=installer-$(date -u +%Y%m%d-%H%M)
          mkdir teile
          sudo split -b 1900M -d "$ISO" teile/auriliux-os.iso.teil
          (cd teile && sha256sum auriliux-os.iso.teil* > pruefsummen.txt && sudo sha256sum "$ISO" | sed 's#  .*/#  #' >> pruefsummen.txt)
          gh release create "$TAG" teile/* --repo "${{ github.repository }}" \
            --title "Auriliux OS Installer $TAG" \
            --notes "Zusammensetzen: cat auriliux-os.iso.teil* > auriliux-os.iso (Prüfsummen in pruefsummen.txt)"
