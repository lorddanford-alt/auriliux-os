# Boot-Intro (Plymouth) gehört ins initramfs – dort fragt es auch nach dem Festplatten-Passwort
add_dracutmodules+=" plymouth "
# Nur die Grafik des MacBooks (Intel, i915) – sonst kämen über 150 MB Treiber und Firmware fremder Grafikkarten dazu
omit_drivers+=" amdgpu radeon nouveau nvidia nvidia_drm nvidia_modeset xe ast mgag200 vmwgfx qxl virtio_gpu bochs hibmc_drm hyperv_drm gma500_gfx loongson "
