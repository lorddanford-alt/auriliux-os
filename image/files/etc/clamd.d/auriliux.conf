# ClamAV-Einstellungen für den Guardian (Socket nur lokal, keine Netzwerk-Schnittstelle)
LocalSocket /run/clamd.auriliux/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
Foreground yes
LogSyslog yes
LogTime no
MaxThreads 2
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
ConcurrentDatabaseReload no
SelfCheck 3600
